name: Check /etc/hosts (ppc64le)

on: workflow_dispatch

jobs:
  check-hosts:
    runs-on: ubuntu-24.04-ppc64le-p10

    steps:
      - name: Check current hosts file
        run: |
          echo "Before:"
          cat /etc/hosts
          wc -l /etc/hosts

      - name: Try modifying /etc/hosts
        run: |
          echo "192.168.102.164 test-host.local" | sudo tee -a /etc/hosts

      - name: Verify modification
        run: |
          echo "After:"
          cat /etc/hosts
          grep -i "test-host.local" /etc/hosts
          getent hosts test-host.local
