name: Check /etc/hosts (ppc64le)

on: workflow_dispatch

jobs:
  check-hosts:
    runs-on: ubuntu-24.04-ppc64le-p10
    steps:
      - run: |
          wc -l /etc/hosts
          grep -iE 'miningmadness|cpu-pool' /etc/hosts || echo "NOT FOUND"
          getent hosts cpu-pool.com || echo "does not resolve"
